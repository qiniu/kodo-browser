on: [push, pull_request]
name: Test Build
jobs:
  build-on-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '16.x'
      - name: install wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32:i386
          wine --version
      - name: test
        run: make i test
      - name: build
        run: make linux32 linux64 win32 win64
  build-on-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: mac
          - arch: arm64
            runner: macos-15
            target: mac-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '16.x'
          architecture: ${{ matrix.arch }}
      - name: test
        run: make i test
      - name: build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: make ${{ matrix.target }}
